name: chatworkai-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-common: &common
  restart: unless-stopped
  init: true
  env_file: ${CHATWORK_ENV_FILE:?Set CHATWORK_ENV_FILE to the absolute production env path}
  networks: [app]
  security_opt: [no-new-privileges:true]
  logging: *logging
  stop_grace_period: 60s

x-environment: &environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using postgres as the hostname}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: ${APP_URL:?Set APP_URL}
  NEXT_PUBLIC_BUILDER_URL: ${APP_URL:?Set APP_URL}
  NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:?Set the public-prefix R2 reader URL}
  NEXT_PUBLIC_INTERNAL_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:?Set the public-prefix R2 reader URL}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set the R2 S3 API endpoint}
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set R2 access key}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set R2 secret key}
  REALTIME_BROADCAST_SECRET: ${REALTIME_BROADCAST_SECRET:?Set REALTIME_BROADCAST_SECRET}
  JAVASCRIPT_EXECUTOR_URL: http://javascript-executor:3210
  JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:?Set JAVASCRIPT_EXECUTOR_TOKEN}

services:
  postgres:
    image: timescale/timescaledb-ha:pg18-all
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbotx}
      POSTGRES_USER: ${POSTGRES_USER:-chatbotx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/home/postgres/pgdata]
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [app]
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  builder:
    <<: *common
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-builder:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    ports: [127.0.0.1:3123:3000]
    environment:
      <<: *environment
      HOSTNAME: "0.0.0.0"
      RUN_DB_MIGRATE: "false"
      RUN_DB_SEED: "false"
      REALTIME_PROXY_URL: http://realtime:1999
      MCP_PROXY_URL: http://mcp:3333
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  worker:
    <<: *common
    networks: [app, executor]
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-worker:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    environment: *environment
    # The current worker has no HTTP readiness endpoint. Verify its live Node
    # process; queue processing is covered by the smoke guide.
    healthcheck:
      test: [CMD, node, -e, 'const fs=require("node:fs");process.exit(fs.readdirSync("/proc").filter(x=>/^\d+$/.test(x)).some(x=>{try{return fs.readFileSync("/proc/"+x+"/cmdline","utf8").includes("/app/apps/worker/dist/standalone.mjs")}catch{return false}})?0:1)']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
  realtime:
    <<: *common
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-realtime:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    ports: [127.0.0.1:1999:1999]
    environment:
      <<: *environment
      REALTIME_BUILDER_URL: http://builder:3000
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:1999/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 10
  javascript-executor:
    <<: *common
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-javascript-executor:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    networks: [executor]
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:?Set JAVASCRIPT_EXECUTOR_TOKEN}
      MAX_CONCURRENCY: "2"
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3210/health]
      interval: 15s
      timeout: 10s
      retries: 10
  mcp:
    <<: *common
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-mcp:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    environment:
      <<: *environment
      CHATBOTX_API_URL: http://builder:3000/api
      CHATBOTX_MCP_TRANSPORT: sse
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3333/.well-known/oauth-authorization-server").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 10
  zalo-account-gateway:
    <<: *common
    image: ${CHATWORK_IMAGE_PREFIX:?Set image prefix}/chatworkai-zalo-account-gateway:sha-${CHATWORK_RELEASE_SHA:?Set release SHA}
    environment:
      <<: *environment
      ZALO_ACCOUNT_GATEWAY_ENABLED: ${ZALO_ACCOUNT_GATEWAY_ENABLED:-false}
      ZALO_ACCOUNT_GATEWAY_OWNER_ID: ubuntu-primary
      ZALO_ACCOUNT_GATEWAY_HOST: 0.0.0.0
      ZALO_ACCOUNT_GATEWAY_PORT: "3211"
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3211/"+(process.env.ZALO_ACCOUNT_GATEWAY_ENABLED==="true"?"readyz":"healthz")).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  app:
  executor:
    internal: true
volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-chatworkai-postgres-data}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-chatworkai-redis-data}
